name: henrike_profile DAG

on:
  schedule:
    - cron: "0 12 * * *"   # todo dia, 09:00 em Brasília
  workflow_dispatch:        # rodar na mão pela aba Actions
  push:
    branches: [main]
    paths: ["scripts/**", "data/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gera os cards SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py

      - name: Commit se mudou
        run: |
          git config user.name "henrike-profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: dag run $(TZ=America/Sao_Paulo date +%F)" && git push)
